<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nock — 기록하고 노션에 쌓아가세요</title>
  <link rel="icon" type="image/png" href="/appicon_s.png">
  <link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css" rel="stylesheet">
  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fff;
      --fg: #111;
      --accent: #FF5C35;
      --gray: #888;
      --border: #e8e8e8;
      --card-bg: #f8f8f8;
    }

    body {
      font-family: 'NanumSquareRound', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 1.4rem 2.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      text-decoration: none;
      display: flex;
      align-items: center;
    }

    .logo img {
      height: 52px;
      width: auto;
      display: block;
      mix-blend-mode: multiply;
    }

    .header-tag {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--gray);
      letter-spacing: 0.01em;
    }

    /* ── Main ── */
    main {
      flex: 1;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
      padding: 6rem 2.5rem 5rem;
    }

    /* ── Hero ── */
    .hero {
      margin-bottom: 6rem;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent);
      margin-bottom: 1.4rem;
    }

    .hero-eyebrow::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .hero h1 {
      font-size: clamp(2.2rem, 4.5vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.2;
      margin-bottom: 1.4rem;
    }

    @media (max-width: 600px) {
      .hero h1 { font-size: clamp(2.2rem, 8vw, 3rem); }
    }

    .hero h1 .highlight {
      color: var(--accent);
    }

    .hero-desc {
      font-size: 1rem;
      color: #6a6a6a;
      line-height: 1.75;
      max-width: 420px;
    }

    /* ── Section ── */
    .section-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1.4rem;
    }

    .section-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gray);
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Apps Grid ── */
    .apps-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      width: fit-content;
    }

    .app-card {
      flex: 0 0 280px;
      background: #f5f5f5;
      border-radius: 20px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      transition: background 0.15s;
    }

    .app-card:hover { background: #efefef; }

    .app-icon {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 12px;
    }

    .app-info { display: flex; flex-direction: column; gap: 0.35rem; }

    .app-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--fg);
    }

    .app-desc {
      font-size: 0.82rem;
      color: var(--gray);
      line-height: 1.5;
    }

    .app-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.5rem;
    }

    .badge {
      display: inline-block;
      width: fit-content;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0.22rem 0.55rem;
      border-radius: 5px;
    }

    .badge--ios {
      background: #2c2c2c;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .badge--subtle {
      background: #ebebeb;
      color: #555;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 2.5rem;
    }

    .footer-biz {
      display: none;
    }

    .footer-biz p {
      font-size: 0.72rem;
      color: #aaa;
      line-height: 1.6;
    }

    .footer-biz strong {
      color: #888;
      font-weight: 700;
    }

    .footer-biz a {
      color: #aaa;
      text-decoration: none;
    }

    .footer-biz a:hover { color: var(--fg); }

    .footer-bottom {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .footer-bottom p {
      font-size: 0.75rem;
      color: var(--gray);
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
    }

    .footer-links a {
      font-size: 0.75rem;
      color: var(--gray);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-links a:hover { color: var(--fg); }

    @media (max-width: 600px) {
      header, main, footer { padding-left: 1.5rem; padding-right: 1.5rem; }
      main { padding-top: 4rem; padding-bottom: 4rem; }
      .hero { margin-bottom: 4rem; }
    }
  </style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

  <header>
    <a href="/" class="logo">
      <img src="/nock-logo-concept-4.png" alt="nock">
    </a>
  </header>

  <main>
    <div class="hero">
      <p class="hero-eyebrow">노션 연동 기록 앱 시리즈</p>
      <h1>앱에서 기록하고,<br><span class="highlight">노션에 쌓아가세요.</span></h1>
      <p class="hero-desc">노션 템플릿과 연동되는 기록 앱 시리즈.<br>기록이 쌓일수록 내가 선명해져요.</p>
    </div>

    <div class="section-header">
      <span class="section-label">Apps</span>
      <span class="section-line"></span>
    </div>

    <div class="apps-grid">
      <a class="app-card" href="/todoreport" style="text-decoration:none;color:inherit;">
        <img class="app-icon" src="/appicon_s.png" alt="투두x리포트 아이콘">
        <div class="app-info">
          <p class="app-name">투두x리포트</p>
          <p class="app-desc">할일과 리포트를 앱에서 쉽게 기록하고 노션에서 관리하세요.</p>
          <div class="app-tags">
            <span class="badge badge--ios">iOS</span>
            <span class="badge badge--subtle">노션연동</span>
            <span class="badge badge--subtle">위젯</span>
            <span class="badge badge--subtle">무료</span>
          </div>
        </div>
      </a>
    </div>
  </main>

  <footer>
    <div class="footer-biz">
      <p><strong>노크</strong> &nbsp;|&nbsp; <strong>이메일</strong> <a href="mailto:nockcreator@gmail.com">nockcreator@gmail.com</a></p>
    </div>
    <div class="footer-bottom">
      <p>© 2026 nock.kr</p>
      <nav class="footer-links">
        <a href="/privacy">개인정보처리방침</a>
        <a href="/terms">이용약관</a>
      </nav>
    </div>
  </footer>

</body>
</html>
